<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการผู้ใช้ — Dashboard OSP BKK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F3322;--ink2:#315A28;--muted:#637361;--line:#DCE8D7;--soft:#F7FBF5;--accent:#4F9517;--danger:#BE123C;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:#F4F7F1;color:var(--ink)}
.ico{width:16px;height:16px;flex:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(135deg,#FFF 0%,#F4FAEF 55%,#DFF1C9 100%);border-bottom:1px solid #D6E6CE}
header b{font-size:20px;color:#4F8F18}
header small{display:block;font-size:12px;color:var(--muted)}
header .sp{flex:1}
.navbtn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid #CFE0C5;border-radius:8px;background:#F7FBF5;color:var(--ink2);text-decoration:none;font-size:13px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#F2F8EF}
.ph b{color:#355E27}
.ph small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.tools input,.tools select{height:36px;border:1px solid #CFE0C5;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:#fff}
.tools input{flex:1 1 200px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid #EEF4EB;vertical-align:middle}
tr.off td{color:#94A3B8}
.uname{font-family:var(--mono);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:6px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.b-admin{background:#EEF2FF;border-color:#C7D2FE;color:#3730A3}
.b-on{background:#F0FDF4;border-color:#BBF7D0;color:#166534}
.b-off{background:#F1F5F9;border-color:#CBD5E1;color:#475569}
.dev{font-size:12px;color:var(--ink2)}
.dev small{display:block;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit}
.btn{height:32px;padding:0 10px;border-radius:8px;border:1px solid #CFE0C5;background:#fff;color:var(--ink2);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:#F2F8EF}
.btn.primary{background:linear-gradient(135deg,#79BD2D,#4F9517);border:0;color:#fff;font-weight:600;height:40px;width:100%;justify-content:center;font-size:14px}
.btn.warn{color:#9A3412;border-color:#FED7AA}
.btn.danger{color:var(--danger);border-color:#FECDD3}
form.card{padding:14px;display:flex;flex-direction:column;gap:10px}
form.card label{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
form.card input,form.card select{height:38px;border:1px solid #CFE0C5;border-radius:8px;padding:0 10px;font:inherit;font-size:14px;background:#fff}
.side{display:flex;flex-direction:column;gap:16px}
.co{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid #EEF4EB;font-size:13px}
.co small{color:var(--muted)}
.co.off{color:#94A3B8}
.msg{margin:0 14px 12px;font-size:12.5px;min-height:18px}
.msg.err{color:var(--danger)}.msg.ok{color:#166534}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F3322;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;display:none;z-index:50}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.7.7 3 2.5 3.5 5.2"/></g></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3v-9Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></symbol>
  <symbol id="i-unlink" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6M3 3l18 18"/></g></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l2 2M15 8l2 2"/></g></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></g></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></g></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></g></symbol>
</svg>
<header>
  <svg class="ico" style="width:28px;height:28px;color:#4F8F18" aria-hidden="true"><use href="#i-users"/></svg>
  <div><b>จัดการผู้ใช้</b><small>Dashboard OSP BKK · 1 บัญชีใช้ได้ 1 เครื่อง (ผู้ดูแลระบบไม่จำกัด)</small></div>
  <span class="sp"></span>
  <a class="navbtn" href="/"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg>หน้าแรก</a>
  <a class="navbtn" href="/logout"><svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg>ออกจากระบบ</a>
</header>

<main>
  <section class="panel" aria-label="ผู้ใช้">
    <div class="ph"><b>ผู้ใช้ · <span id="uCount">-</span></b><small>เครื่องที่ใช้อยู่ = เครื่องที่กำลังล็อกอินบัญชีนั้น</small></div>
    <div class="tools">
      <label class="sr" for="q" style="position:absolute;left:-9999px">ค้นหา</label>
      <input id="q" type="search" placeholder="ค้นหาชื่อผู้ใช้ / ชื่อ">
      <label for="fCo" style="position:absolute;left:-9999px">บริษัท</label>
      <select id="fCo"><option value="">ทุกบริษัท</option></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>ผู้ใช้</th><th>บริษัท</th><th>สถานะ</th><th>เครื่องที่ใช้อยู่</th><th>เข้าล่าสุด</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">กำลังโหลด…</td></tr></tbody>
      </table>
    </div>
  </section>

  <div class="side">
    <section class="panel" aria-label="สร้างผู้ใช้">
      <div class="ph"><b>สร้างผู้ใช้ใหม่</b></div>
      <form class="card" id="fNew">
        <label>ชื่อผู้ใช้ (ใช้ล็อกอิน)<input name="username" required autocomplete="off" placeholder="เช่น dmp.somchai"></label>
        <label>ชื่อที่แสดง<input name="display_name" placeholder="เช่น สมชาย ใจดี"></label>
        <label>บริษัท<select name="company_id" id="newCo"></select></label>
        <label>สิทธิ์<select name="role"><option value="user">ผู้ใช้ทั่วไป</option><option value="admin">ผู้ดูแลระบบ</option></select></label>
        <label>รหัสผ่านเริ่มต้น<input name="password" required minlength="6" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัว"></label>
        <button class="btn primary" type="submit">สร้างผู้ใช้</button>
      </form>
      <div class="msg" id="newMsg"></div>
    </section>

    <section class="panel" aria-label="บริษัท">
      <div class="ph"><b>บริษัท</b><small>ปิดบริษัท = ผู้ใช้ในบริษัทเข้าไม่ได้</small></div>
      <div id="cos"></div>
      <form class="card" id="fCoNew" style="flex-direction:row;align-items:flex-end">
        <label style="flex:1">เพิ่มบริษัท<input name="name" required placeholder="ชื่อบริษัท"></label>
        <button class="btn" type="submit" style="height:38px">เพิ่ม</button>
      </form>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
let S = {users: [], companies: [], me: null};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (id) => `<svg class="ico" aria-hidden="true"><use href="#${id}"/></svg>`;
const when = (t) => t ? new Date(t * 1000).toLocaleString("th-TH", {day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"}) : "-";
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600); }

async function post(action, body) {
  const r = await fetch("/admin/api/" + action, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.success) throw new Error(j.message || ("HTTP " + r.status));
  S.users = j.users; S.companies = j.companies; render();
  return j;
}

function render() {
  const coOpts = S.companies.map(c => `<option value="${c.id}">${esc(c.name)}${c.active ? "" : " (ปิด)"}</option>`).join("");
  const keep = $("fCo").value;
  $("fCo").innerHTML = `<option value="">ทุกบริษัท</option>` + coOpts; $("fCo").value = keep;
  $("newCo").innerHTML = `<option value="">— ไม่ระบุ (เฉพาะผู้ดูแล) —</option>` + S.companies.filter(c => c.active).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const q = $("q").value.trim().toLowerCase(), co = $("fCo").value;
  const list = S.users.filter(u => (!co || String(u.company_id) === co) && (!q || (u.username + " " + u.display_name).toLowerCase().includes(q)));
  $("uCount").textContent = S.users.length;
  $("rows").innerHTML = list.length ? list.map(u => `
    <tr class="${u.active ? "" : "off"}">
      <td><div class="uname">${esc(u.username)}</div><div style="font-size:12px;color:var(--muted)">${esc(u.display_name || "")}</div></td>
      <td>${esc(u.company || "-")}</td>
      <td>${u.role === "admin" ? '<span class="badge b-admin">ผู้ดูแล</span> ' : ""}${u.active ? '<span class="badge b-on">ใช้งาน</span>' : '<span class="badge b-off">ปิด</span>'}</td>
      <td class="dev">${u.sessions ? `${esc(u.device)}${u.sessions > 1 ? ` + อีก ${u.sessions - 1}` : ""}<small>ใช้ล่าสุด ${when(u.last_seen)}</small>` : '<span style="color:var(--muted)">ไม่ได้ล็อกอิน</span>'}</td>
      <td style="font-size:12px">${when(u.last_login_at)}</td>
      <td><div class="acts">
        ${u.sessions ? `<button class="btn warn" data-a="release" data-id="${u.id}">${icon("i-unlink")}ปลดเครื่อง</button>` : ""}
        <button class="btn" data-a="edit" data-id="${u.id}">${icon("i-edit")}แก้ไข</button>
        <button class="btn" data-a="pw" data-id="${u.id}">${icon("i-key")}รีเซ็ตรหัส</button>
        ${S.me && u.id === S.me.id ? "" : `<button class="btn ${u.active ? "danger" : ""}" data-a="active" data-id="${u.id}">${icon("i-power")}${u.active ? "ปิดบัญชี" : "เปิดบัญชี"}</button>`}
      </div></td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">ไม่พบผู้ใช้</td></tr>`;
  $("cos").innerHTML = S.companies.map(c => `
    <div class="co ${c.active ? "" : "off"}"><span>${esc(c.name)} <small>· ${c.users} คน</small></span>
      <button class="btn ${c.active ? "danger" : ""}" data-co="${c.id}" data-on="${c.active ? 0 : 1}">${c.active ? "ปิด" : "เปิด"}</button></div>`).join("");
}

$("rows").onclick = async (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const u = S.users.find(x => x.id === +b.dataset.id);
  try {
    if (b.dataset.a === "release") {
      if (!confirm(`ปลดเครื่องของ ${u.username}?\nเครื่องเดิมจะถูกออกจากระบบ และล็อกอินเครื่องใหม่ได้`)) return;
      await post("release_device", {id: u.id}); toast("ปลดเครื่องแล้ว");
    } else if (b.dataset.a === "pw") {
      const pw = prompt(`รหัสผ่านใหม่ของ ${u.username} (อย่างน้อย 6 ตัว)\nทุกเครื่องของบัญชีนี้จะถูกออกจากระบบ`); if (!pw) return;
      await post("set_password", {id: u.id, password: pw}); toast("เปลี่ยนรหัสผ่านแล้ว");
    } else if (b.dataset.a === "active") {
      if (u.active && !confirm(`ปิดบัญชี ${u.username}? ผู้ใช้จะเข้าระบบไม่ได้จนกว่าจะเปิดใหม่`)) return;
      await post("set_active", {id: u.id, active: !u.active}); toast(u.active ? "ปิดบัญชีแล้ว" : "เปิดบัญชีแล้ว");
    } else if (b.dataset.a === "edit") {
      const name = prompt("ชื่อที่แสดง", u.display_name || ""); if (name === null) return;
      const list = S.companies.map((c, k) => `${k + 1}. ${c.name}`).join("\n");
      const pick = prompt(`บริษัท (พิมพ์หมายเลข · เว้นว่าง = ไม่เปลี่ยน)\n${list}`, "");
      const co = pick && S.companies[+pick - 1] ? S.companies[+pick - 1].id : undefined;
      await post("update_user", {id: u.id, display_name: name, company_id: co}); toast("บันทึกแล้ว");
    }
  } catch (err) { alert(err.message); }
};
$("cos").onclick = async (e) => {
  const b = e.target.closest("[data-co]"); if (!b) return;
  const c = S.companies.find(x => x.id === +b.dataset.co);
  if (b.dataset.on === "0" && !confirm(`ปิดบริษัท ${c.name}? ผู้ใช้ทั้ง ${c.users} คนจะถูกออกจากระบบและเข้าไม่ได้`)) return;
  try { await post("set_company_active", {id: c.id, active: b.dataset.on === "1"}); } catch (err) { alert(err.message); }
};
$("fNew").onsubmit = async (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  $("newMsg").className = "msg"; $("newMsg").textContent = "";
  try { await post("create_user", d); e.target.reset(); $("newMsg").className = "msg ok"; $("newMsg").textContent = `สร้าง ${d.username} แล้ว`; }
  catch (err) { $("newMsg").className = "msg err"; $("newMsg").textContent = err.message; }
};
$("fCoNew").onsubmit = async (e) => {
  e.preventDefault();
  try { await post("add_company", Object.fromEntries(new FormData(e.target))); e.target.reset(); } catch (err) { alert(err.message); }
};
$("q").oninput = render; $("fCo").onchange = render;
fetch("/admin/api/state").then(r => r.json()).then(j => { S = j; render(); });
</script>
</body>
</html>
